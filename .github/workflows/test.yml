name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intelligent_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest requests
      - name: 启动服务
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/intelligent_assistant
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          uvicorn app.main:app --port 8000 &
          sleep 15
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest requests email-validator
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest requests email-validator
          pip install langchain-community langchain-text-splitters
          pip install pytest requests allure-pytest playwright
          playwright install chromium
      - name: 注册测试用户
        run: |
          curl -X POST http://localhost:8000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","password":"123456","email":"test@example.com"}'
      - name: 运行测试
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/intelligent_assistant
        run: |
          pytest tests/ -v